<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="440"
     viewBox="0 0 720 440">
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="680" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientTransform="translate(118 44) rotate(36) scale(420 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c6cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(654 286) rotate(155) scale(350 230)" gradientUnits="userSpaceOnUse">
