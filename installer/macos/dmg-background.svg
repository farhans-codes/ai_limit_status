<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="720"
     height="440"
     viewBox="0 0 720 440">
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="680" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientTransform="translate(118 44) rotate(36) scale(420 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c6cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(654 286) rotate(155) scale(350 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38d9c6" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#38d9c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="110" y1="96" x2="610" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.105"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.045"/>
    </linearGradient>
    <linearGradient id="arrow" x1="286" y1="247" x2="434" y2="247" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9d91ff"/>
      <stop offset="1" stop-color="#5de2d2"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="url(#background)"/>
  <rect width="720" height="440" fill="url(#purpleGlow)"/>
  <rect width="720" height="440" fill="url(#cyanGlow)"/>

  <g opacity="0.32">
    <circle cx="664" cy="52" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="664" cy="52" r="49" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="42" cy="374" r="92" fill="none" stroke="#7c6cff" stroke-opacity="0.20"/>
  </g>

  <text x="360" y="60" text-anchor="middle" fill="#dfe5f1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">
    Drag AI Limit Status into Applications to install
  </text>

  <g filter="url(#shadow)">
    <rect x="88" y="88" width="190" height="166" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.13"/>
    <rect x="442" y="88" width="190" height="166" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.13"/>
  </g>

  <g>
    <line x1="292" y1="171" x2="421" y2="171" stroke="url(#arrow)" stroke-width="4" stroke-linecap="round"/>
    <path d="M407 156 L424 171 L407 186" fill="none" stroke="#5de2d2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="358" y="149" text-anchor="middle" fill="#a9b4c8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">
      DRAG TO INSTALL
    </text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600">
    <rect x="126" y="284" width="122" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="144" cy="298" r="4" fill="#5de2d2"/>
    <text x="155" y="302" fill="#c9d2e2">Open source</text>

    <rect x="260" y="284" width="126" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="278" cy="298" r="4" fill="#9d91ff"/>
    <text x="289" y="302" fill="#c9d2e2">No analytics</text>

    <rect x="398" y="284" width="196" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="416" cy="298" r="4" fill="#ffad66"/>
    <text x="427" y="302" fill="#c9d2e2">No API keys to paste</text>
  </g>

  <text x="360" y="350" text-anchor="middle" fill="#77839a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">
    github.com/farhans-codes/ai_limit_status
  </text>
</svg>
