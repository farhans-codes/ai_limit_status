name: Bug report
description: Report a reproducible problem in AI Limit Status.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, access tokens, or private account data.
        Report security vulnerabilities through the Security tab instead.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Both
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: AI Limit Status version
      placeholder: "For example: 0.3.0"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Codex
        - Claude
        - Both
        - Not provider-specific
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or redacted details
      description: Remove usernames, paths, tokens, and other private data.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials and private account data.
          required: true
