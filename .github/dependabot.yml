version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    # Version-update PRs are paused.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    # Version-update PRs are paused.
    open-pull-requests-limit: 0
