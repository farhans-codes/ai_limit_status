version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    # Pause version-update PRs while the repository uses only main.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Pause version-update PRs while the repository uses only main.
    open-pull-requests-limit: 0
