name: Notify Telegram

# Sends a Telegram message when any other workflow finishes. `workflow_run`
# always uses this file from the default branch and checks out no code, so a
# pull request cannot change what runs or read the bot token.
on:
  workflow_run:
    workflows:
      - "CI"
      - "Publish release"
      - "Publish website"
      - "Build Windows installer"
    types: [completed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Branch names and commit titles come from contributors, so they
          # reach the shell only as environment variables.
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set; skipping." >&2
            exit 0
          fi
          # Say what happened in plain words instead of workflow jargon.
          case "$WORKFLOW" in
            "CI") what="Code check" ;;
            "Publish release") what="Release workflow" ;;
            "Publish website") what="Website update" ;;
            "Build Windows installer") what="Windows installer" ;;
            *) what="$WORKFLOW" ;;
          esac
          case "$CONCLUSION" in
            success)
              icon="✅"; result="passed"
              note="Everything is fine. Nothing to do." ;;
            failure)
              icon="❌"; result="failed"
              note="Something broke. Open the details to see what." ;;
            cancelled)
              icon="⏹"; result="stopped"
              note="A newer change replaced this run. Nothing to do." ;;
            *)
              icon="⚠️"; result="$CONCLUSION"
              note="Open the details to check." ;;
          esac
          case "$EVENT" in
            pull_request) where="Pull request from $BRANCH" ;;
            *) where="Branch $BRANCH" ;;
          esac
          # Telegram reads the message as HTML, so escape text people wrote.
          escape() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          text="$(printf '%s <b>%s %s</b>\n\n📝 %s\n🌿 %s\n\n%s\n\n<a href="%s">Open details</a>' \
            "$icon" "$what" "$result" \
            "$(escape "$COMMIT_TITLE")" "$(escape "$where")" \
            "$note" "$RUN_URL")"
          curl --silent --show-error --fail --max-time 20 \
            --output /dev/null \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true"
