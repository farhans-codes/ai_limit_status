name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Read and validate version
        shell: bash
        run: |
          app_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$app_version" || "$app_version" != "$tag_version" ]]; then
            echo "Tag $tag_version does not match pubspec version $app_version" >&2
            exit 1
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Build macOS release
        run: |
          flutter pub get
          flutter analyze
          flutter build macos --release

      - name: Package macOS artifacts
        shell: bash
        run: |
          app_path="build/macos/Build/Products/Release/AI Limit Status.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          mkdir -p dist build/dmg-stage
          ditto "$app_path" "build/dmg-stage/AI Limit Status.app"
          ln -s /Applications "build/dmg-stage/Applications"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "dist/AI-Limit-Status-${APP_VERSION}-macOS.zip"
          hdiutil create \
            -volname "AI Limit Status" \
            -srcfolder build/dmg-stage \
            -ov \
            -format UDZO \
            "dist/AI-Limit-Status-${APP_VERSION}-macOS.dmg"
          hdiutil verify "dist/AI-Limit-Status-${APP_VERSION}-macOS.dmg"
          unzip -t "dist/AI-Limit-Status-${APP_VERSION}-macOS.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: dist/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Read and validate version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)'
          if (-not $match.Matches.Success) {
            throw 'Could not read the application version from pubspec.yaml.'
          }
          $appVersion = $match.Matches[0].Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($appVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match pubspec version $appVersion."
          }
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows release
        run: |
          flutter pub get
          flutter analyze
          flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path 'build\windows\x64\runner\Release\*' `
            -DestinationPath "dist\AI-Limit-Status-$env:APP_VERSION-Windows-x64-portable.zip" `
            -CompressionLevel Optimal
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DMyAppVersion=$env:APP_VERSION" 'windows\installer\ai_limit_status.iss'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum AI-Limit-Status-* > "AI-Limit-Status-${GITHUB_REF_NAME#v}-SHA256SUMS.txt"
          sha256sum --check "AI-Limit-Status-${GITHUB_REF_NAME#v}-SHA256SUMS.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "AI Limit Status $GITHUB_REF_NAME"
