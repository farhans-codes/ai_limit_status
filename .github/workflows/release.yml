name: Publish release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Opens or updates the Release PR. Merging that PR creates a draft release
  # and its tag; the jobs below build into it and publish it only once every
  # installer is uploaded, so the in-app update check never sees a release
  # without its installer.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build-macos:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Read and validate version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          app_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          tag_version="${RELEASE_TAG#v}"
          if [[ -z "$app_version" || "$app_version" != "$tag_version" ]]; then
            echo "Tag $tag_version does not match pubspec version $app_version" >&2
            exit 1
          fi
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Build macOS release
        run: |
          flutter pub get
          flutter analyze
          flutter build macos --release

      - name: Package macOS artifacts
        shell: bash
        run: |
          app_path="build/macos/Build/Products/Release/AI Limit Status.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" \
            "dist/AI-Limit-Status-macOS.zip"
          bash scripts/create_macos_dmg.sh \
            "$app_path" \
            "dist/AI-Limit-Status-macOS.dmg" \
            "installer/macos/dmg-background.png"
          unzip -t "dist/AI-Limit-Status-macOS.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: dist/*
          if-no-files-found: error

  build-windows:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Read and validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)'
          if (-not $match.Matches.Success) {
            throw 'Could not read the application version from pubspec.yaml.'
          }
          $appVersion = $match.Matches[0].Groups[1].Value
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($appVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match pubspec version $appVersion."
          }
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows release
        run: |
          flutter pub get
          flutter analyze
          flutter build windows --release

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          ./scripts/bundle_windows_runtime.ps1 `
            -Destination 'build\windows\x64\runner\Release'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path 'build\windows\x64\runner\Release\*' `
            -DestinationPath "dist\AI-Limit-Status-Windows-x64-portable.zip" `
            -CompressionLevel Optimal
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DMyAppVersion=$env:APP_VERSION" 'windows\installer\ai_limit_status.iss'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [release-please, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum AI-Limit-Status-* > "AI-Limit-Status-SHA256SUMS.txt"
          sha256sum --check "AI-Limit-Status-SHA256SUMS.txt"

      - name: Upload assets and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest \
            --title "AI Limit Status $RELEASE_TAG"

      # The release is already public at this point, so a Telegram hiccup
      # must not turn the run red or hold back the sync to develop.
      - name: Announce the release on Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: ${{ vars.NOTIFY_TIMEZONE || 'Asia/Dhaka' }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set; skipping." >&2
            exit 0
          fi
          row() { printf '<b>%s:</b> <code>%s</code>\n' "$1" "$2"; }
          pick() { shift $((RANDOM % $#)); printf '%s' "$1"; }
          text="$(printf '%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s' \
            "🚀 <b>A new version is live!</b> 🎉📦" \
            "$(row "🏷️ Version" "$RELEASE_TAG")" \
            "$(row "💻 Installers" "macOS and Windows, both uploaded")" \
            "$(row "🕒 When" "$(date '+%d %b %Y · %I:%M %p')")" \
            "$(row "📂 Repository" "$GITHUB_REPOSITORY")" \
            "📲 Installed apps check for updates every six hours, so everyone should see it by then." \
            "$(pick "🥂 Shipped! Time to celebrate." "🎈 Out the door it goes." "🛳️ Bon voyage, little release.")")"
          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$text" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md" \
            '{
              chat_id: $chat_id,
              text: $text,
              parse_mode: "HTML",
              disable_web_page_preview: true,
              reply_markup: {inline_keyboard: [[
                {text: "📦 View release", url: $url},
                {text: "📝 What changed", url: $notes}
              ]]}
            }' |
          curl --silent --show-error --fail --max-time 20 \
            --output /dev/null \
            --header "Content-Type: application/json" \
            --data @- \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

  # The release bumped the version and changelog on main; bring them back to
  # develop so the two branches do not drift apart.
  sync-develop:
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open a pull request from main into develop
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --head main \
            --title "chore: sync develop with $RELEASE_TAG" \
            --body "Brings the version bump and changelog from the $RELEASE_TAG release back to develop. Merge with a merge commit, not a squash."
