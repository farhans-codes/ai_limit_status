name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          ./scripts/bundle_windows_runtime.ps1 `
            -Destination 'build\windows\x64\runner\Release'

      - name: Read application version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)'
          if (-not $versionLine.Matches.Success) {
            throw 'Could not read the application version from pubspec.yaml.'
          }
          "APP_VERSION=$($versionLine.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path 'build\windows\x64\runner\Release\*' `
            -DestinationPath "dist\AI-Limit-Status-$env:APP_VERSION-Windows-x64-portable.zip" `
            -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DMyAppVersion=$env:APP_VERSION" 'windows\installer\ai_limit_status.iss'

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Out-File -Encoding ascii 'dist\SHA256SUMS.txt'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AI-Limit-Status-${{ env.APP_VERSION }}-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
