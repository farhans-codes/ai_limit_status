name: ai_limit_status
description: "AI Limit Status — Codex and Claude subscription usage monitor."
publish_to: 'none'
version: 0.3.0+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  get: ^4.7.3
  launch_at_startup: ^0.5.1
  flutter_local_notifications: ^22.3.0
  screen_retriever: ^0.2.2
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/claude.svg
    - assets/icons/codex.svg
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png
    - windows/runner/resources/app_icon.ico
